<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/jipfit-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="집핏 — 내 상황에 맞는 집을 AI가 근거와 함께 추천">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="집핏">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>집핏 — AI 부동산 추천</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pretendard — 한국어 프리미엄 웹폰트 (SIL OFL 무료 라이선스) -->
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

  <!-- 인트로 스플래시 — Flutter 첫 프레임 전까지 표시 -->
  <style>
    #jipfit-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 0%, #16233c 0%, #0b1424 55%, #080f1c 100%);
      transition: opacity .45s ease; font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    }
    #jipfit-splash .mark {
      width: 76px; height: 76px; border-radius: 22px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 18px 48px rgba(0,0,0,.45);
      animation: jf-pop .7s cubic-bezier(.2,.9,.3,1.2) both;
    }
    #jipfit-splash .mark svg { width: 40px; height: 40px; }
    #jipfit-splash .name {
      margin-top: 22px; color: #fff; font-size: 27px; font-weight: 800; letter-spacing: -0.01em;
      animation: jf-fade .8s ease .15s both;
    }
    #jipfit-splash .tag {
      margin-top: 8px; color: #8099bd; font-size: 13.5px; font-weight: 500;
      animation: jf-fade .8s ease .3s both;
    }
    #jipfit-splash .bar {
      margin-top: 34px; width: 132px; height: 3px; border-radius: 99px;
      background: rgba(255,255,255,.12); overflow: hidden;
      animation: jf-fade .8s ease .45s both;
    }
    #jipfit-splash .bar i {
      display: block; height: 100%; width: 40%; border-radius: 99px;
      background: linear-gradient(90deg, #155eef, #16b27a);
      animation: jf-slide 1.15s ease-in-out infinite;
    }
    @keyframes jf-pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    @keyframes jf-fade { from { transform: translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }
    @keyframes jf-slide { 0% { margin-left: -42% } 100% { margin-left: 102% } }
  </style>
</head>
<body>
  <div id="jipfit-splash">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="#155eef"><path d="M12 3l9 8h-2.6v9h-4.8v-5.6H10.4V20H5.6v-9H3l9-8z"/></svg>
    </div>
    <div class="name">집핏</div>
    <div class="tag">내 상황에 딱 맞는 집, AI가 근거와 함께</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    // Flutter 첫 프레임이 그려지면 스플래시 페이드아웃
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('jipfit-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 500);
    });
  </script>
  <script src="flutter_bootstrap.js?v=1785658244" async></script>
</body>
</html>
